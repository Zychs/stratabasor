<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>bottle · stratabasor</title>
<!-- The bottle page, served at /bottle and fed by shelf.py; its docstring names the five levels. -->
<style>
  :root {
    --bg: #0c1218; --panel: #101820; --ink: #c5d4e6; --soft: #8ea4bc; --line: #243244;
    /* stratabasor's two families, mixed into the ink so every tone keeps its distance from the picked background */
    --blue: hsl(212 70% 56%); --amber: hsl(32 85% 56%);
    --add: color-mix(in srgb, hsl(140 60% 45%) 55%, var(--ink));
    --del: color-mix(in srgb, hsl(0 70% 55%) 55%, var(--ink));
    --chg: color-mix(in srgb, var(--amber) 70%, var(--ink));
    --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
  }
  .L-items    { --c: color-mix(in srgb, var(--blue) 60%, var(--ink));  --b: solid; }
  .L-versions { --c: color-mix(in srgb, var(--amber) 60%, var(--ink)); --b: solid; }
  .L-chapters { --c: color-mix(in srgb, var(--blue) 30%, var(--ink));  --b: dashed; }
  .L-eras     { --c: color-mix(in srgb, var(--amber) 30%, var(--ink)); --b: dotted; }
  .L-precious { --c: color-mix(in srgb, var(--amber) 85%, var(--ink)); --b: double; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 15px/1.4 "Segoe UI", sans-serif; }
  button, input, select { font: inherit; color: inherit; }

  #bar {
    position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
    padding: 6px 16px; font-size: 13px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  #bar a { color: var(--soft); text-decoration: none; }
  #bar h1 { margin: 0; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--soft); }
  #bar select, #bar input, #bar button { padding: 2px 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 2px; }
  #bar input { width: 11em; }
  #status, .none { color: var(--soft); }
  .legend { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-left: auto; }
  .legend i { font-style: normal; color: var(--c); }
  @media (max-width: 600px) { .legend { display: none; } }
  #page {
    display: grid; grid-template-columns: minmax(0, 1fr) clamp(320px, 32vw, 460px); gap: 16px; align-items: start;
    max-width: 1680px; margin: 0 auto; padding: 10px 16px 50vh;
  }
  @media (max-width: 980px) { #page { grid-template-columns: minmax(0, 1fr); } #book { display: none; } }

  /* A node per level, each the one above at .92 scale. Brightness carries importance: what
     changed reads at full ink, what held still steps back to soft. */
  .node {
    margin: 0.2em 0; border: 1px var(--b) color-mix(in srgb, var(--c) 35%, transparent); border-radius: 2px;
    background: color-mix(in srgb, var(--c) 5%, var(--panel));
  }
  .node.open { border-color: var(--c); }
  .node.L-versions { border-left-width: 3px; }
  .head {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.15em 0.5em; width: 100%; padding: 0.25em 0.6em;
    text-align: left; background: none; border: 0; cursor: pointer;
  }
  .head:hover { background: color-mix(in srgb, var(--c) 9%, transparent); }
  .head:focus-visible { outline: 1px solid var(--c); outline-offset: -1px; }
  .mark { color: var(--c); }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .dim, .when, .meta, .quiet > .head .name { color: var(--soft); font-weight: 400; }
  .when { font-size: 0.85em; }
  .meta { margin-left: auto; font-size: 0.8em; }
  .tag { font-size: 0.8em; }
  .t-new { color: var(--add); }
  .t-chg { color: var(--chg); }
  .t-del { color: var(--del); }
  .t-fmt { color: var(--soft); }
  .gone > .head .name { color: var(--soft); text-decoration: line-through; }
  .kids {
    display: none; font-size: 0.92em; margin: 0 0.4em 0.3em 0.9em; padding-left: 0.5em;
    border-left: 1px solid color-mix(in srgb, var(--c) 35%, transparent);
  }
  .open > .kids { display: block; }

  .gem { margin: 0.2em 0; padding: 0.3em 0.5em 0.4em; border: 3px double var(--c); border-radius: 2px; background: var(--bg); }
  .row { display: flex; align-items: baseline; gap: 0.5em; }
  .copy { margin-left: auto; padding: 0 0.4em; font-size: 0.8em; color: var(--c); background: none; border: 1px solid var(--line); cursor: pointer; }
  pre { margin: 0.3em 0 0; padding: 0.3em 0; overflow-x: auto; font: max(12px, 0.9em)/1.45 var(--mono); }
  pre span { position: relative; display: block; width: max-content; min-width: 100%; padding: 0 1em 0 1.6em; white-space: pre; }
  pre span::before { position: absolute; left: 0.5em; }
  pre.diff span { color: var(--soft); }
  pre.diff .add { color: var(--ink); }
  pre .add::before { content: "+"; color: var(--add); }
  pre .del { color: var(--del); text-decoration: line-through; }
  pre .del::before { content: "−"; }

  /* The book card, in house negentropic-blue (journal-clip clip_look.py). --a is attention, 0 to 1:
     the frame lights and the text comes up to full contrast as it gathers. */
  #book {
    --nb-bg: #050509; --nb-void: #0a0a10; --nb-line: #272739; --nb-ink: #e7e7f2; --nb-strong: #f4f4fb;
    --nb-soft: #a7a7bd; --nb-mute: #6c6c83; --nb-cyan: #7cf7ff; --nb-cyan-soft: #9fe9f1; --nb-amber: #e2a24a;
    --nb-good: #4cae7c; --nb-mono: Consolas, "Cascadia Mono", ui-monospace, monospace;
    --a: 0;
    position: sticky; top: calc(var(--bar-h, 40px) + 10px); max-height: calc(100vh - var(--bar-h, 40px) - 20px);
    overflow: auto; overscroll-behavior: contain; padding: 10px 14px 12px;
    color: var(--nb-ink); background: var(--nb-void);
    border: 1px solid color-mix(in srgb, var(--nb-cyan) calc(var(--a) * 100%), var(--nb-line));
  }
  #book .mast {
    display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; padding-bottom: 4px;
    border-bottom: 1px solid var(--nb-line); font: 11px/1.3 var(--nb-mono); color: var(--nb-cyan);
  }
  #book .mast span { overflow-wrap: anywhere; }
  #book .mast span + span { white-space: nowrap; color: var(--nb-mute); }
  #book h2 { margin: 0 0 2px; font-size: 17px; line-height: 1.25; font-weight: 600; color: var(--nb-strong); overflow-wrap: anywhere; }
  #book .n { color: var(--nb-mute); font-weight: 400; }
  #book .doc { margin: 0; color: var(--nb-soft); }
  #book .held { margin: 2px 0 6px; font: 11px var(--nb-mono); color: var(--nb-mute); }
  #book .text { margin: 0; padding: 6px 0; font: 12.5px/1.5 var(--nb-mono); color: var(--nb-strong); background: var(--nb-bg); border: 1px solid var(--nb-line); }
  #book .text span { padding-left: 3.6em; }
  #book .text span::before { content: attr(data-n); left: 0; width: 2.9em; text-align: right; color: var(--nb-mute); }
  #book .text.diff span { color: var(--nb-soft); }
  #book .text.diff .add { color: var(--nb-strong); }
  #book .text, #book .toc { opacity: calc(0.55 + 0.45 * var(--a)); }
  #book .t-new { color: var(--nb-good); }
  #book .t-chg { color: var(--nb-amber); }
  #book .t-del, #book .t-fmt { color: var(--nb-mute); }
  #book button { padding: 1px 2px; font: inherit; color: var(--nb-cyan-soft); background: none; border: 0; cursor: pointer; }
  #book button:focus-visible { outline: 1px solid var(--nb-cyan); }
  #book .toc { margin: 4px 0 0; padding: 0; list-style: none; }
  #book .toc button { display: flex; gap: 8px; width: 100%; text-align: left; color: var(--nb-ink); }
  #book .toc .pg { margin-left: auto; font: 11px var(--nb-mono); color: var(--nb-mute); }
  #book .toc .quiet button, #book .toc .removed button { color: var(--nb-soft); }
  #book .toc .removed .nm { text-decoration: line-through; }
  #book .toc .new .n { color: var(--nb-good); }
  #book .toc .changed .n { color: var(--nb-amber); }
  #book .folio { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font: 11px var(--nb-mono); color: var(--nb-mute); }
  #book .folio > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<header id="bar">
  <a href="/">&#9666; stratabasor</a>
  <h1>bottle</h1>
  <select id="pick" aria-label="bottle" hidden></select>
  <button id="again" type="button" title="read the bottle again" hidden>&#8635;</button>
  <span id="status">reading the shelf …</span>
  <input id="filter" type="search" placeholder="filter items" aria-label="filter items" hidden />
  <select id="sort" aria-label="sort items" hidden>
    <option value="recent">recent first</option>
    <option value="name">by name</option>
  </select>
  <span class="legend" aria-label="levels">
    <i class="L-items">&#9635; items</i>
    <i class="L-versions">&#9672; versions</i>
    <i class="L-chapters">&sect; chapters</i>
    <i class="L-eras">&#9719; eras</i>
    <i class="L-precious">&#9670; precious</i>
  </span>
</header>
<main id="page">
  <div id="board"></div>
  <aside id="book" aria-label="book card"></aside>
</main>
<script>
"use strict";
const GRACE = 280; // ms an open node waits after the pointer leaves before it folds
const SETTLE = 0.3; // attention-seconds a node needs before the card turns to it
const MARK = { items: "▣", versions: "◈", chapters: "§", eras: "◷", precious: "◆" };
const $ = (s) => document.querySelector(s);
const board = $("#board"), bookEl = $("#book"), statusEl = $("#status"), pickEl = $("#pick"), againEl = $("#again");
const filterEl = $("#filter"), sortEl = $("#sort");
let bottle = null; // { root, items: [{ path, versions, last, data }] }
let py = -1, pressed = false;
const waiting = new Set(), holds = new Set();

// Wear the tint picked in stratabasor's colors overlay.
try {
  const t = JSON.parse(localStorage.getItem("stratabasor.theme") || "null");
  if (t) for (const k in t) if (k[0] === "-") document.documentElement.style.setProperty(k, t[k]);
} catch (_) {}

function api(path, params) {
  return fetch(path + "?" + new URLSearchParams(params)).then(async (r) => {
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "HTTP " + r.status);
    return j;
  });
}

function h(tag, cls, ...kids) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  el.append(...kids.filter(Boolean));
  return el;
}
function act(el, fn) {
  el.type = "button";
  el.onclick = fn;
  return el;
}
const tag = (text, cls) => h("span", "tag " + cls, text);
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const fmt = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
const when = (iso) => fmt.format(new Date(iso));
function ago(iso) {
  const m = (Date.now() - Date.parse(iso)) / 6e4;
  return m < 1 ? "just now" : m < 60 ? `${m | 0}m ago` : m < 1440 ? `${(m / 60) | 0}h ago` : m < 43200 ? `${(m / 1440) | 0}d ago` : when(iso);
}
const label = (c) => ({ module: "module code", unparsed: "whole file" })[c.key] || c.key;
const span = (e) => (e.from === e.to ? "v" + e.from : `v${e.from}–v${e.to}`);
const STATUS = { new: "t-new", changed: "t-chg", removed: "t-del" };
// An era's life: from its first version to the version that ended it.
function life(d, e) {
  const next = d.versions[e.to];
  return `${when(d.versions[e.from - 1].at)} → ${next ? when(next.at) : "now"}`;
}
// What a version changed, as tags: shared by the fractal and the card.
function summary(v) {
  const x = v.delta;
  if (!v.parsed) return [tag("syntax error", "t-del")];
  if (!x) return [tag("first", "t-new")];
  if (x.unparsed) return [tag("after syntax error", "t-fmt")];
  if (!x.add && !x.chg && !x.del) return [tag("≈ cosmetic", "t-fmt")];
  return [x.add && tag("+" + x.add, "t-new"), x.chg && tag("~" + x.chg, "t-chg"), x.del && tag("−" + x.del, "t-del")].filter(Boolean);
}
// A chapter that held still through this version steps back; in a first or unparsed version none can.
const quiet = (v, c) => Boolean(v.delta && !v.delta.unparsed && !c.status);

/* ---- the shelf ---- */

async function start() {
  let bottles;
  try { ({ bottles } = await api("/api/bottle/shelf", {})); }
  catch (e) { statusEl.textContent = e.message; return; }
  if (!bottles.length) {
    statusEl.textContent = "no bottles under the known roots (.bottle/bottle.db, from bottle.py snapshot)";
    return;
  }
  pickEl.replaceChildren(...bottles.map((b) => {
    const o = h("option", null, `${b.name} · ${ago(b.last)}`);
    o.value = o.title = b.root;
    return o;
  }));
  let want = new URLSearchParams(location.search).get("root");
  try { want = want || localStorage.getItem("stratabasor.bottle"); } catch (_) {}
  pickEl.value = bottles.some((b) => b.root === want) ? want : bottles[0].root;
  pickEl.hidden = againEl.hidden = false;
  read(pickEl.value);
}

async function read(root) {
  try { localStorage.setItem("stratabasor.bottle", root); } catch (_) {}
  history.replaceState(null, "", "?root=" + encodeURIComponent(root));
  statusEl.textContent = "reading …";
  try {
    const j = await api("/api/bottle/items", { root });
    if (pickEl.value !== root) return;
    bottle = { root, items: j.items };
    filterEl.hidden = sortEl.hidden = false;
    render();
    show(null);
  } catch (e) {
    statusEl.textContent = e.message;
  }
}

function itemData(it) {
  return (it.data ||= api("/api/bottle/item", { root: bottle.root, path: it.path }).catch((e) => { it.data = null; throw e; }));
}

function render() {
  const f = filterEl.value.trim().toLowerCase();
  const byName = (a, b) => a.path.localeCompare(b.path);
  const list = bottle.items.filter((it) => it.path.toLowerCase().includes(f))
    .sort(sortEl.value === "name" ? byName : (a, b) => b.last.localeCompare(a.last) || byName(a, b));
  const total = bottle.items.reduce((s, it) => s + it.versions, 0);
  statusEl.textContent = `${plural(bottle.items.length, "item")} · ${plural(total, "version")}`;
  board.replaceChildren(...(list.length ? list.map(itemNode)
    : [h("p", "none", bottle.items.length ? "no item matches" : "this bottle is empty")]));
}

/* ---- the five levels ---- */

function node(level, headKids, build, cls, subject) {
  const n = h("div", `node L-${level} ${cls || ""}`);
  const head = h("button", "head", h("span", "mark", MARK[level]), ...headKids);
  head.type = "button";
  head.setAttribute("aria-expanded", "false");
  const kids = h("div", "kids");
  kids.setAttribute("role", "group");
  n.append(head, kids);
  n._build = build;
  n._subject = subject;
  n.addEventListener("mouseenter", () => { clearTimeout(n._t); waiting.delete(n); });
  n.addEventListener("mouseleave", () => n.classList.contains("open") && arm(n));
  return n;
}

function itemNode(it) {
  const cut = it.path.lastIndexOf("/") + 1;
  return node("items", [
    h("span", "name", h("span", "dim", it.path.slice(0, cut)), it.path.slice(cut)),
    h("span", "meta", `${plural(it.versions, "version")} · ${ago(it.last)}`),
  ], () => itemData(it).then((d) => d.versions.slice().reverse().map((v) => versionNode(d, v))));
}

function versionNode(d, v) {
  return node("versions", [
    h("span", "name", "v" + v.n), h("span", "when", when(v.at)), ...summary(v),
    h("span", "meta", `${plural(v.lines, "line")} · ${v.sha}`),
  ], () => (v.chapters.length ? v.chapters.map((c) => chapterNode(d, v, c)) : [h("p", "none", "empty file")]), "", { d, v });
}

function chapterNode(d, v, c) {
  return node("chapters", [h("span", "name", label(c)), c.status && tag(c.status, STATUS[c.status]), h("span", "meta", plural(c.lines, "line"))],
    () => d.eras[c.key].slice().reverse().map((e, i, all) => eraNode(d, v, c, e, i + 1 < all.length)),
    c.status === "removed" ? "gone" : quiet(v, c) ? "quiet" : "", { d, v, c });
}

function eraNode(d, v, c, e, hasBefore) {
  const next = d.versions[e.to]; // the first version after the era
  const ends = next && !next.chapters.some((x) => x.key === c.key && x.status !== "removed");
  const fate = ends && (c.key === "unparsed" ? "then fixed" : next.parsed ? "then removed" : "then unparsed");
  return node("eras", [
    h("span", "name", span(e)), h("span", "when", life(d, e)), fate && tag(fate, "t-del"),
    h("span", "meta", plural(e.to - e.from + 1, "version")),
  ], () => [precious(e, hasBefore)], e.from <= v.n && v.n <= e.to ? "" : "quiet", { d, v, c, e });
}

function precious(e, hasBefore) {
  const lines = e.rows.filter((r) => r[0] !== "-").map((r) => r[1]);
  const count = (op) => e.rows.filter((r) => r[0] === op).length;
  const copy = act(h("button", "copy", "copy"), () => navigator.clipboard.writeText(lines.join("\n")).then(
    () => { copy.textContent = "copied"; }, () => { copy.textContent = "copy blocked"; }));
  return h("div", "gem L-precious",
    h("div", "row", h("span", "mark", MARK.precious), h("span", "when", plural(lines.length, "line")),
      hasBefore && tag("+" + count("+"), "t-new"), hasBefore && tag("−" + count("-"), "t-del"), copy),
    h("pre", hasBefore ? "diff" : null, ...e.rows.map(([op, line]) => h("span", { "+": "add", "-": "del" }[op], line || " "))));
}

/* ---- the book card: the attended version as its contents, the attended chapter as its text ---- */

const mast = (left, right) => h("div", "mast", h("span", null, left), h("span", null, right));
const running = (d, v) => mast(d.path, `v${v.n} · ${when(v.at)}`);

function show(sub) {
  const id = sub ? [sub.d.path, sub.v.n, sub.c?.key, sub.e?.from].join("|") : "front|" + (bottle?.root || "");
  if (bookEl.dataset.id === id) return;
  bookEl.dataset.id = id;
  bookEl.replaceChildren(...(!sub ? [mast("bottle", bottle ? plural(bottle.items.length, "item") : ""),
    h("p", "held", "rest on a version, chapter or era")] : sub.c ? chapterPage(sub) : contentsPage(sub)).filter(Boolean));
  bookEl.scrollTop = 0;
}

function contentsPage({ d, v }) {
  const at = d.versions.indexOf(v);
  const turn = (i, text) => d.versions[i] && act(h("button", null, text), () => show({ d, v: d.versions[i] }));
  return [running(d, v), h("h2", null, d.path.split("/").pop(), " ", ...summary(v)),
    h("ol", "toc", ...v.chapters.map((c, i) => h("li", c.status || (quiet(v, c) ? "quiet" : ""), act(h("button", null,
      h("span", "n", "§" + (i + 1)), h("span", "nm", label(c)), h("span", "pg", c.status === "removed" ? "—" : String(c.line))),
      () => show({ d, v, c }))))),
    h("div", "folio", turn(at - 1, `‹ v${at}`) || h("span"), h("span", null, plural(v.lines, "line")), turn(at + 1, `v${at + 2} ›`) || h("span"))];
}

function chapterPage({ d, v, c, e }) {
  const runs = d.eras[c.key];
  // The era read: the one clicked, else the one holding this version, else the last before it (a removed chapter).
  const era = e || runs.find((x) => x.from <= v.n && v.n <= x.to) || runs.filter((x) => x.to < v.n).pop();
  const here = era.from <= v.n && v.n <= era.to && c.status !== "removed";
  const shown = era.rows.filter((r) => r[0] !== "-");
  const list = v.chapters, i = list.indexOf(c);
  const turn = (j, text) => list[j] && act(h("button", null, text), () => show({ d, v, c: list[j] }));
  return [running(d, v), h("h2", null, h("span", "n", "§" + (i + 1)), " ", label(c)),
    c.doc && h("p", "doc", c.doc),
    h("p", "held", (c.status === "removed" ? `removed in v${v.n} · last ` : "") + `held ${span(era)} · ${life(d, era)}`),
    h("pre", runs.indexOf(era) ? "text diff" : "text", ...shown.map(([op, line], k) => {
      const row = h("span", op === "+" ? "add" : null, line || " ");
      if (here) row.dataset.n = c.line + k;
      return row;
    })),
    h("div", "folio", (list[i - 1] && turn(i - 1, "‹ " + label(list[i - 1]))) || h("span"),
      h("span", null, here ? `lines ${c.line}–${c.line + shown.length - 1}` : `as of ${span(era)}`),
      (list[i + 1] && turn(i + 1, label(list[i + 1]) + " ›")) || h("span"))];
}

/* ---- attention = window focus × mouse coherence ---- */

// Focus is 1 while the window is focused and showing. Coherence reads the last second of pointer travel:
// a hand at rest (low spread) or moving straight (net distance near its path) is coherent; a wandering one
// is not. Smoothed, up in ~0.35 s and down in ~1.5 s, it sets the card's contrast and, after SETTLE, its page.
const att = { a: 0, trail: [], raf: 0, t: 0, cand: null, held: 0 };

function coherence(trail) {
  if (trail.length < 3) return 1;
  let path = 0, mx = 0, my = 0;
  trail.forEach((p, i) => {
    mx += p.x;
    my += p.y;
    if (i) path += Math.hypot(p.x - trail[i - 1].x, p.y - trail[i - 1].y);
  });
  if (path < 12) return 1; // a resting hand
  mx /= trail.length;
  my /= trail.length;
  const spread = Math.sqrt(trail.reduce((s, p) => s + (p.x - mx) ** 2 + (p.y - my) ** 2, 0) / trail.length);
  const straight = Math.hypot(trail.at(-1).x - trail[0].x, trail.at(-1).y - trail[0].y) / path;
  return Math.max(Math.exp(-spread / 90), 0.85 * straight);
}

function wake() {
  att.raf ||= requestAnimationFrame(tick);
}

function tick(now) {
  att.raf = 0;
  const dt = att.t ? Math.min(0.1, (now - att.t) / 1000) : 0;
  att.t = now;
  att.trail = att.trail.filter((p) => now - p.t <= 1000);
  const target = (document.hasFocus() && !document.hidden ? 1 : 0) * coherence(att.trail);
  att.a += (target - att.a) * (1 - Math.exp(-dt / (target > att.a ? 0.35 : 1.5)));
  bookEl.style.setProperty("--a", att.a.toFixed(3));
  const settling = Boolean(att.cand?.isConnected) && att.held < SETTLE;
  if (settling) {
    att.held += dt * att.a;
    if (att.held >= SETTLE) show(att.cand._subject);
  }
  if (settling || att.trail.length || Math.abs(target - att.a) > 0.003) wake();
  else att.t = 0;
}

/* ---- click opens one, leaving folds ---- */

// Run fn without moving the anchor on screen, so content changing above the pointer can't slide under it.
function keep(anchor, fn) {
  const y = anchor.getBoundingClientRect().top;
  fn();
  if (anchor.isConnected) scrollBy(0, anchor.getBoundingClientRect().top - y);
}

function unfold(n) {
  for (const sib of n.parentElement.children) if (sib !== n && sib.classList.contains("open")) fold(sib);
  release(n);
  const kids = n.lastElementChild, made = n._build(), gen = (n._gen = (n._gen || 0) + 1);
  n.classList.add("open");
  n.firstElementChild.setAttribute("aria-expanded", "true");
  if (!(made instanceof Promise)) return kids.replaceChildren(...made);
  kids.replaceChildren(h("p", "none", "…"));
  made.then(
    (list) => { if (n._gen === gen && n.classList.contains("open")) kids.replaceChildren(...list); },
    (err) => { if (n._gen === gen) kids.replaceChildren(h("p", "none", err.message)); });
}

function fold(n) {
  clearTimeout(n._t);
  waiting.delete(n);
  n._gen = (n._gen || 0) + 1;
  n.classList.remove("open");
  n.firstElementChild.setAttribute("aria-expanded", "false");
  n.lastElementChild.replaceChildren();
}

function arm(n) {
  clearTimeout(n._t);
  waiting.add(n);
  n._t = setTimeout(() => { waiting.delete(n); leave(n); }, GRACE);
}

function leave(n) {
  if (!n.isConnected || !n.classList.contains("open") || n.matches(":hover")) return;
  if (pressed) return arm(n); // mid-drag (selecting, scrollbar): wait for the release
  const was = n.getBoundingClientRect();
  fold(n);
  // Left downward: keep the folded height as a gap, so what the pointer moved onto stays put.
  if (py > was.bottom) {
    n.style.marginBottom = `calc(0.2em + ${was.height - n.getBoundingClientRect().height}px)`;
    holds.add(n);
  }
}

// A gap closes once the pointer is back above it, where nothing can slide under the hand.
function release(n) {
  n.style.marginBottom = "";
  holds.delete(n);
}

board.addEventListener("click", (e) => {
  const head = e.target.closest(".head");
  if (!head) return;
  const n = head.parentElement;
  keep(head, () => (n.classList.contains("open") ? fold(n) : unfold(n)));
  if (n._subject && n.classList.contains("open")) show(n._subject);
});
addEventListener("pointermove", (e) => {
  py = e.clientY;
  for (const n of holds) if (!n.isConnected || py < n.getBoundingClientRect().bottom) release(n);
  if (e.pointerType === "touch") return;
  att.trail.push({ x: e.clientX, y: e.clientY, t: e.timeStamp });
  const n = e.target.closest?.(".node.L-versions, .node.L-chapters, .node.L-eras") || null;
  if (n !== att.cand) { att.cand = n; att.held = 0; }
  wake();
}, { passive: true });
document.documentElement.addEventListener("mouseleave", () => { att.cand = null; });
addEventListener("focus", wake);
document.addEventListener("visibilitychange", wake);
addEventListener("pointerdown", (e) => { if (e.pointerType === "mouse") pressed = true; });
addEventListener("pointerup", () => { pressed = false; });
addEventListener("blur", () => { pressed = false; wake(); });
addEventListener("scroll", () => waiting.forEach(arm), { passive: true }); // still scrolling: not left yet
addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  const n = [...board.querySelectorAll(".node.open")].pop();
  if (!n) return;
  const focused = n.contains(document.activeElement);
  fold(n);
  if (focused) n.firstElementChild.focus();
});

pickEl.addEventListener("change", () => read(pickEl.value));
againEl.addEventListener("click", () => read(pickEl.value));
filterEl.addEventListener("input", render);
sortEl.addEventListener("change", () => {
  try { localStorage.setItem("stratabasor.bottle.sort", sortEl.value); } catch (_) {}
  render();
});
try { sortEl.value = localStorage.getItem("stratabasor.bottle.sort") || "recent"; } catch (_) {}
// The card sits below the sticky bar, and anything scrolled or tabbed into view lands below it too.
new ResizeObserver(() => {
  const bar = $("#bar").offsetHeight;
  document.documentElement.style.setProperty("--bar-h", bar + "px");
  document.documentElement.style.scrollPaddingTop = bar + 8 + "px";
}).observe($("#bar"));
show(null);
wake();
start();
</script>
</body>
</html>
