<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>stratabasor</title>
<style>
  :root {
    --bg: #0c1218;
    --panel: #101820;
    --ink: #c5d4e6;
    --soft: #8ea4bc;
    --line: #243244;
    --row: #16202b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body { font: 17px/1.45 "Segoe UI", sans-serif; }
  #app { display: flex; height: 100%; min-height: 0; }
  #spine {
    flex: none; width: 220px; background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
  }
  #spine.collapsed { width: 44px; }
  #spine-top { display: flex; align-items: stretch; }
  #add, #fold {
    appearance: none; border: 0; outline: 0; background: transparent; color: var(--ink);
    margin: 0; min-height: 52px; font: inherit; line-height: 1; cursor: pointer;
  }
  #add { flex: 1; padding: 16px 18px; font-size: 22px; text-align: left; }
  #fold { flex: none; width: 44px; color: var(--soft); font-size: 18px; }
  #fold:hover, #add:hover { color: var(--ink); background: var(--row); }
  #spine.collapsed #add { display: none; }
  #tabs { overflow: auto; padding: 0 8px 12px; }
  #spine.collapsed #tabs { display: none; }
  .tab {
    display: block; width: 100%; text-align: left; margin: 0 0 4px;
    padding: 8px 10px; border: 0; border-radius: 2px; background: transparent;
    color: var(--ink); font: inherit; cursor: pointer;
  }
  .tab.on { background: var(--row); }
  #split { flex: none; width: 6px; cursor: col-resize; background: var(--line); }
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #add-field { display: none; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line); }
  #add-field.open { display: flex; }
  #dir {
    flex: 1; background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    font: inherit; padding: 8px 10px;
  }
  #note { color: var(--soft); align-self: center; }
  /* stratabasor is the main card. The selected repo is its companion card,
     beside it and offset down, so neither covers the other's lines. */
  #stage { display: flex; gap: 16px; flex: 1; min-height: 0; padding: 12px 20px 20px; }
  #tree {
    flex: 1; min-width: 0; min-height: 0; overflow: auto; padding: 8px 0 24px;
    background: var(--panel); border: 1px solid var(--line);
  }
  #tree.split-view { display: flex; padding: 0; overflow: hidden; }
  #dock {
    flex: none; width: min(520px, 42%); margin-top: 60px;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 12px;
    min-height: 0;
  }
  #dock:not(:has(.open)) { display: none; }
  #card {
    display: none; flex: 1 1 0;
    flex-direction: column; min-height: 0;
    background: #141e2a; border: 1px solid var(--line);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
  }
  #card.open { display: flex; }
  #card-body { flex: 1; min-height: 0; overflow: auto; padding: 8px 0 16px; }
  #card-head {
    display: flex; align-items: baseline; gap: 10px; padding: 10px 8px 8px 14px;
    border-bottom: 1px solid var(--line);
  }
  #card-name { font-weight: 600; white-space: nowrap; }
  #card-path {
    flex: 1; min-width: 0; color: var(--soft); font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left;
  }
  #card-x {
    appearance: none; border: 0; background: transparent; color: var(--soft);
    font: inherit; font-size: 16px; cursor: pointer; padding: 0 6px;
  }
  #card-x:hover { color: var(--ink); }
  .pane { flex: 1; min-width: 0; overflow: auto; }
  .pane + .pane { border-left: 1px solid var(--line); }
  .pane { display: flex; flex-direction: column; min-height: 0; }
  .pane-body { flex: 1; min-height: 0; overflow: auto; }
  .pane-head { display: flex; align-items: center; gap: 4px; padding: 8px 8px 4px 12px; }
  .pane-head .title, .pane-head .up {
    appearance: none; border: 0; background: transparent; color: var(--soft);
    font: 600 12px/1.4 "Segoe UI", sans-serif; letter-spacing: 0.08em;
    text-transform: uppercase; cursor: pointer; padding: 4px 6px;
  }
  .pane-head .title {
    flex: 1; min-width: 0; text-align: left;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pane-head .title:hover, .pane-head .up:hover { color: var(--ink); background: var(--row); }
  .pane-head input {
    flex: 1; min-width: 0; background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); font: 13px "Segoe UI", sans-serif; padding: 4px 6px;
  }
  .pane-head .bad { color: #d98b8b; font-size: 12px; }
  .empty { color: var(--soft); padding: 16px; }
  ul { list-style: none; margin: 0; padding: 0; }
  ul.kids { padding-left: 16px; }
  li.shut > ul { display: none; }
  .row {
    display: flex; align-items: center; gap: 8px; width: 100%;
    text-align: left; background: transparent; color: var(--ink);
    border: 0; padding: 6px 10px; font: inherit; cursor: pointer; white-space: nowrap;
  }
  .row:hover { background: var(--row); }
  .row.sel { background: #1e2d3d; box-shadow: inset 3px 0 0 var(--soft); }
  .mark { color: var(--soft); width: 1.4em; flex: none; text-align: center; border-radius: 2px; }
  .mark.can:hover { background: var(--line); color: var(--ink); }
  .kind { color: var(--soft); font-size: 12px; letter-spacing: 0.04em; }
  #tip {
    display: none; flex: 0 0 auto; max-height: 45%;
    overflow: auto; padding: 10px 14px 12px;
    background: #182431; border: 1px solid var(--line);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
    font-size: 13px; line-height: 1.45;
  }
  #tip.open { display: block; }
  #tip .shut-x {
    float: right; margin: -4px -6px 0 8px; padding: 0 6px;
    background: transparent; border: 0; color: var(--soft); font: inherit; font-size: 16px;
    cursor: pointer;
  }
  /* Narrow windows: the companion drops under the main card, then the two
     columns stack too, so nothing is squeezed to a sliver. */
  @media (max-width: 1000px) {
    #stage { flex-direction: column; padding: 10px; gap: 10px; }
    #tree { flex: 1 1 55%; }
    #dock { width: auto; margin-top: 0; flex: 1 1 45%; }
  }
  @media (max-width: 640px) {
    #tree.split-view { flex-direction: column; }
    .pane + .pane { border-left: 0; border-top: 1px solid var(--line); }
  }
  #tip .meter { display: flex; gap: 3px; margin-bottom: 6px; }
  #tip .meter i { flex: 1; height: 2px; background: var(--line); }
  #tip .meter i.on { background: var(--soft); }
  #tip .head { font-weight: 600; word-break: break-all; }
  #tip dl { margin: 4px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; }
  #tip dt { color: var(--soft); }
  #tip dd { margin: 0; word-break: break-all; }
</style>
</head>
<body>
<div id="app">
  <aside id="spine">
    <div id="spine-top">
      <button id="fold" type="button" aria-label="collapse spine" title="collapse spine">&lsaquo;</button>
      <button id="add" type="button" aria-label="add directory">+</button>
    </div>
    <nav id="tabs"></nav>
  </aside>
  <div id="split" title="drag to resize, click to collapse"></div>
  <main id="main">
    <form id="add-field">
      <input id="dir" type="text" placeholder="directory" autocomplete="off" />
      <span id="note"></span>
    </form>
    <div id="stage">
      <div id="tree" class="split-view"></div>
      <div id="dock">
        <section id="tip" aria-label="hovered row" aria-live="polite"></section>
        <section id="card" aria-label="selected directory">
          <div id="card-head">
            <span id="card-name"></span>
            <span id="card-path"></span>
            <button id="card-x" type="button" aria-label="close">&times;</button>
          </div>
          <div id="card-body"></div>
        </section>
      </div>
    </div>
  </main>
</div>
<script>
(function () {
  var spine = document.getElementById("spine");
  var split = document.getElementById("split");
  var field = document.getElementById("add-field");
  var dir = document.getElementById("dir");
  var note = document.getElementById("note");
  var tabsEl = document.getElementById("tabs");
  var treeEl = document.getElementById("tree");
  var card = document.getElementById("card");
  var cardBody = document.getElementById("card-body");
  var fold = document.getElementById("fold");
  var cardName = document.getElementById("card-name");
  var cardPath = document.getElementById("card-path");
  var roots = [];
  var active = -1;
  var binds = [];
  var wide = 220;
  var columns = [];
  var LABELS = ["dev", "durable"];
  var selected = null;

  function same(a, b) {
    function norm(x) { return String(x || "").replace(/[\\/]+$/, "").toLowerCase(); }
    return !!a && !!b && norm(a) === norm(b);
  }

  function leaf(path) {
    return String(path).split(/[\\/]/).filter(Boolean).pop() || path;
  }

  function paintTabs() {
    tabsEl.innerHTML = "";
    roots.forEach(function (path, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "tab" + (i === active ? " on" : "");
      b.textContent = leaf(path);
      b.title = path;
      b.addEventListener("click", function () {
        if (i === active) selectPath(null); else selectPath(path);
      });
      tabsEl.appendChild(b);
    });
  }

  function kindWord(node) {
    if (node.type === "branch_local") {
      if (node.is_current) return "local head";
      return node.in_worktree ? "local, other worktree" : "local";
    }
    if (node.type === "branch_remote") return "remote";
    if (node.type === "branch_group") return "branches";
    if (node.type === "repository") return "repo";
    if (node.type === "directory") return "folder";
    return "file";
  }

  function canSelect(node) {
    return node.type === "directory" || node.type === "repository";
  }

  // In the main card a row click selects that folder into the companion card and
  // the chevron expands it. In the companion card a row click expands, as before.
  function renderNode(node, depth, picks) {
    var li = document.createElement("li");
    var openFirst = depth === 0 || node.type === "branch_group";
    if (!openFirst) li.className = "shut";
    var row = document.createElement("button");
    row.type = "button";
    row.className = "row";
    if (picks && canSelect(node) && same(node.path, selected)) row.classList.add("sel");
    var mark = document.createElement("span");
    mark.className = "mark";
    function canOpen() { return (node.children || []).length > 0 || node.more; }
    function paintMark() {
      mark.textContent = canOpen() ? (li.classList.contains("shut") ? ">" : "v") : "";
      mark.classList.toggle("can", canOpen());
    }
    var name = document.createElement("span");
    name.textContent = node.name || "?";
    var kind = document.createElement("span");
    kind.className = "kind";
    kind.textContent = kindWord(node);
    row.appendChild(mark);
    row.appendChild(name);
    row.appendChild(kind);
    row.tipNode = node;
    row.dataset.path = node.path || "";
    var ul = null;
    function paintKids() {
      if (ul) ul.remove();
      ul = null;
      var list = node.children || [];
      if (!list.length) return;
      ul = document.createElement("ul");
      ul.className = "kids";
      list.forEach(function (ch) { ul.appendChild(renderNode(ch, depth + 1, picks)); });
      li.appendChild(ul);
    }
    function toggle() {
      if (!canOpen()) return;
      var opening = li.classList.contains("shut");
      if (opening && node.more) {
        node.more = false;
        mark.textContent = "\u2026";
        loadTree(node.path, 1).then(function (fresh) {
          var branches = (node.children || []).filter(function (c) { return c.type === "branch_group"; });
          var rest = (fresh.children || []).filter(function (c) { return c.type !== "branch_group"; });
          node.children = branches.concat(rest);
          paintKids();
          li.classList.remove("shut");
          paintMark();
        }).catch(function () { paintMark(); });
        return;
      }
      li.classList.toggle("shut");
      paintMark();
    }
    row.addEventListener("click", function (e) {
      if (picks && canSelect(node) && e.target !== mark) { selectPath(node.path); return; }
      toggle();
    });
    li.appendChild(row);
    paintKids();
    paintMark();
    return li;
  }

  // Hover tips. Where the pointer sits across a row sets how much the tip says:
  // the left edge is the name, the right edge is everything, git detail included.
  var tip = document.getElementById("tip");
  var TIERS = 4;
  var tipRow = null;
  var tipTier = -1;
  var tipTimer = 0;
  var detailCache = {};

  function tierAt(row, x) {
    var r = row.getBoundingClientRect();
    var f = r.width ? (x - r.left) / r.width : 0;
    return Math.max(0, Math.min(TIERS - 1, Math.floor(f * TIERS)));
  }

  function bytes(n) {
    if (n == null) return null;
    var u = ["B", "KB", "MB", "GB"];
    var i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (i ? n.toFixed(1) : n) + " " + u[i];
  }

  function when(sec) {
    return sec == null ? null : new Date(sec * 1000).toLocaleString();
  }

  function counts(node) {
    var c = { folder: 0, file: 0, branch: 0 };
    (node.children || []).forEach(function (ch) {
      if (ch.type === "file") c.file++;
      else if (ch.type === "branch_group") c.branch += (ch.children || []).length;
      else if (ch.type === "branch_local" || ch.type === "branch_remote") c.branch++;
      else c.folder++;
    });
    var out = [];
    if (c.folder) out.push(c.folder + (c.folder > 1 ? " folders" : " folder"));
    if (c.file) out.push(c.file + (c.file > 1 ? " files" : " file"));
    if (c.branch) out.push(c.branch + (c.branch > 1 ? " branches" : " branch"));
    return out.join(", ") || null;
  }

  function detailKey(node) {
    if (node.type === "branch_local" || node.type === "branch_remote") {
      return node.repo ? node.repo + "|" + node.name : null;
    }
    if (node.type === "file" || node.type === "branch_group") return null;
    return node.path || null;
  }

  function askDetail(node) {
    var key = detailKey(node);
    if (!key || detailCache[key]) return;
    var q = "/api/detail?path=" + encodeURIComponent(node.repo || node.path);
    if (node.repo) q += "&branch=" + encodeURIComponent(node.name);
    detailCache[key] = { pending: true };
    fetch(q).then(function (r) { return r.json(); }).then(function (j) {
      detailCache[key] = j.error ? {} : j;
    }).catch(function () {
      detailCache[key] = {};
    }).then(function () {
      if (tipRow && tipRow.tipNode === node && tipTier === TIERS - 1) showTip();
    });
  }

  function tipLines(node, tier) {
    var lines = [];
    function add(label, value) { if (value != null && value !== "") lines.push([label, value]); }
    if (tier >= 1) {
      add("in", node.rel_path);
      if (node.type === "repository") add("on", node.current_branch);
      if (node.repo) add("repo", node.repo.split(/[\\/]/).filter(Boolean).pop());
      add("holds", counts(node));
    }
    if (tier >= 2) {
      add("path", node.path);
      add("size", bytes(node.size));
      add("changed", when(node.mtime));
    }
    if (tier >= 3) {
      var key = detailKey(node);
      var d = key && detailCache[key];
      if (d && d.pending) add("git", "reading…");
      if (d && d.entries != null) add("on disk", d.entries + " entries");
      if (d && d.commit) {
        add("last", d.commit.hash + " " + d.commit.subject);
        add("by", d.commit.author + ", " + new Date(d.commit.date).toLocaleString());
      }
    }
    return lines;
  }

  function paintTip() {
    var node = tipRow.tipNode;
    tip.innerHTML = "";
    var x = document.createElement("button");
    x.type = "button";
    x.className = "shut-x";
    x.setAttribute("aria-label", "close");
    x.textContent = "×";
    x.addEventListener("click", hideTip);
    tip.appendChild(x);
    var meter = document.createElement("div");
    meter.className = "meter";
    for (var i = 0; i < TIERS; i++) {
      var seg = document.createElement("i");
      if (i <= tipTier) seg.className = "on";
      meter.appendChild(seg);
    }
    tip.appendChild(meter);
    var head = document.createElement("div");
    head.className = "head";
    head.textContent = (node.name || "?") + "  ·  " + kindWord(node);
    tip.appendChild(head);
    var lines = tipLines(node, tipTier);
    if (!lines.length) return;
    var dl = document.createElement("dl");
    lines.forEach(function (pair) {
      var dt = document.createElement("dt");
      dt.textContent = pair[0];
      var dd = document.createElement("dd");
      dd.textContent = pair[1];
      dl.appendChild(dt);
      dl.appendChild(dd);
    });
    tip.appendChild(dl);
  }

  // The hover card stacks above the companion card. It keeps the last row
  // hovered, so the pointer can leave the tree and the card stays.
  function showTip() {
    paintTip();
    tip.classList.add("open");
  }

  function hideTip() {
    clearTimeout(tipTimer);
    tipRow = null;
    tipTier = -1;
    tip.classList.remove("open");
  }

  document.addEventListener("pointermove", function (e) {
    var row = e.target.closest ? e.target.closest(".row") : null;
    if (!row || !row.tipNode || e.pointerType === "touch") {
      clearTimeout(tipTimer);
      return;
    }
    var tier = tierAt(row, e.clientX);
    if (row !== tipRow) {
      clearTimeout(tipTimer);
      tipTimer = setTimeout(function () {
        tipRow = row;
        tipTier = tier;
        showTip();
        if (tipTier === TIERS - 1) askDetail(row.tipNode);
      }, 180);
      return;
    }
    if (tier !== tipTier) {
      tipTier = tier;
      showTip();
      if (tier === TIERS - 1) askDetail(row.tipNode);
    }
  });

  function loadTree(root, depth) {
    var q = "/api/tree?root=" + encodeURIComponent(root);
    if (depth) q += "&depth=" + depth;
    return fetch(q).then(function (r) { return r.json(); }).then(function (tree) {
      if (tree.error) throw new Error(tree.error);
      return tree;
    });
  }

  function fill(host, root, depth, picks) {
    host.innerHTML = "";
    return loadTree(root, depth).then(function (tree) {
      var ul = document.createElement("ul");
      ul.appendChild(renderNode(tree, 0, picks));
      host.innerHTML = "";
      host.appendChild(ul);
    }).catch(function () {
      host.innerHTML = "<p class='empty'>That directory did not open.</p>";
    });
  }

  function setColumn(i, path, bad) {
    return fetch("/api/columns", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ index: i, path: path })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) { if (bad) bad(); return; }
        columns = res.j.columns || columns;
        paintColumn(i);
      });
  }

  function parentOf(path) {
    var trimmed = String(path).replace(/[\\/]+$/, "");
    var cut = Math.max(trimmed.lastIndexOf("\\"), trimmed.lastIndexOf("/"));
    if (cut <= 0) return null;
    var up = trimmed.slice(0, cut);
    return /^[A-Za-z]:$/.test(up) ? up + "\\" : up;
  }

  // Each column header names its folder. Click it to type another; the arrow
  // steps up one folder. The choice is saved, so it comes back next launch.
  function paintColumn(i) {
    var pane = treeEl.children[i];
    var head = pane.querySelector(".pane-head");
    var body = pane.querySelector(".pane-body");
    var path = columns[i];
    head.innerHTML = "";
    var title = document.createElement("button");
    title.type = "button";
    title.className = "title";
    var name = leaf(path);
    title.textContent = name.toLowerCase() === LABELS[i] ? name : LABELS[i] + " \u00b7 " + name;
    title.title = path + "\n(click to change)";
    title.addEventListener("click", function () { editColumn(i); });
    var up = document.createElement("button");
    up.type = "button";
    up.className = "up";
    up.textContent = "\u2191";
    up.title = "up one folder";
    up.disabled = !parentOf(path);
    up.addEventListener("click", function () {
      var parent = parentOf(path);
      if (parent) setColumn(i, parent);
    });
    head.appendChild(title);
    head.appendChild(up);
    fill(body, path, 1, true);
  }

  function editColumn(i) {
    var head = treeEl.children[i].querySelector(".pane-head");
    head.innerHTML = "";
    var input = document.createElement("input");
    input.type = "text";
    input.value = columns[i];
    input.setAttribute("aria-label", LABELS[i] + " folder");
    var bad = document.createElement("span");
    bad.className = "bad";
    head.appendChild(input);
    head.appendChild(bad);
    input.focus();
    input.select();
    var done = false;
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        setColumn(i, input.value, function () { bad.textContent = "missing"; input.focus(); });
      } else if (e.key === "Escape") {
        done = true;
        paintColumn(i);
      }
    });
    input.addEventListener("blur", function () {
      setTimeout(function () {
        if (!done && document.activeElement !== input && head.contains(input)) paintColumn(i);
      }, 150);
    });
  }

  function showSplit() {
    treeEl.className = "split-view";
    treeEl.innerHTML = "";
    columns.forEach(function (path, i) {
      var pane = document.createElement("section");
      pane.className = "pane";
      var head = document.createElement("div");
      head.className = "pane-head";
      var body = document.createElement("div");
      body.className = "pane-body";
      pane.appendChild(head);
      pane.appendChild(body);
      treeEl.appendChild(pane);
      paintColumn(i);
    });
  }

  // One selection drives the right side: the companion card shows it, the
  // matching spine tab lights, and the matching main-card row is marked.
  function selectPath(path) {
    selected = path || null;
    active = -1;
    roots.forEach(function (r, i) { if (same(r, selected)) active = i; });
    paintTabs();
    treeEl.querySelectorAll(".row").forEach(function (row) {
      var node = row.tipNode;
      row.classList.toggle("sel", !!node && canSelect(node) && same(node.path, selected));
    });
    if (!selected) {
      card.classList.remove("open");
      cardBody.innerHTML = "";
      return;
    }
    cardName.textContent = leaf(selected);
    cardPath.textContent = selected;
    cardPath.title = selected;
    card.classList.add("open");
    fill(cardBody, selected, 3, false);
  }

  function select(i) {
    selectPath(i < 0 ? null : roots[i]);
  }

  function cycle(step) {
    if (!roots.length) return;
    var next = active < 0 ? 0 : (active + step + roots.length) % roots.length;
    select(next);
  }

  document.getElementById("add").addEventListener("click", function () {
    field.classList.toggle("open");
    note.textContent = "";
    if (field.classList.contains("open")) dir.focus();
  });

  field.addEventListener("submit", function (e) {
    e.preventDefault();
    note.textContent = "";
    fetch("/api/roots", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: dir.value })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) { note.textContent = "missing"; return; }
        roots = res.j.roots || [];
        dir.value = "";
        field.classList.remove("open");
        select(roots.indexOf(res.j.added));
      });
  });

  function setFold(shut, remember) {
    spine.classList.toggle("collapsed", shut);
    spine.style.width = shut ? "44px" : wide + "px";
    fold.innerHTML = shut ? "&rsaquo;" : "&lsaquo;";
    fold.title = shut ? "open spine" : "collapse spine";
    fold.setAttribute("aria-label", fold.title);
    if (!remember) return;
    try { localStorage.setItem("stratabasor.spine", shut ? "shut" : "open"); } catch (e) {}
  }
  fold.addEventListener("click", function () {
    setFold(!spine.classList.contains("collapsed"), true);
  });
  document.getElementById("card-x").addEventListener("click", function () { selectPath(null); });

  var drag = null;
  split.addEventListener("pointerdown", function (e) {
    drag = { x: e.clientX, moved: false };
    split.setPointerCapture(e.pointerId);
  });
  split.addEventListener("pointermove", function (e) {
    if (!drag) return;
    if (Math.abs(e.clientX - drag.x) > 3) drag.moved = true;
    if (!drag.moved) return;
    spine.classList.remove("collapsed");
    wide = Math.max(120, e.clientX);
    spine.style.width = wide + "px";
  });
  split.addEventListener("pointerup", function () {
    if (drag && !drag.moved) setFold(!spine.classList.contains("collapsed"), true);
    drag = null;
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") hideTip();
    if (e.target.closest("input, textarea")) return;
    var hit = e.key.length === 1 ? e.key.toUpperCase() : e.key;
    binds.forEach(function (b) {
      var keys = b.keys || [];
      var matched = keys.some(function (k) { return k.toUpperCase() === hit.toUpperCase(); });
      if (!matched) return;
      if (b.bind === "spine.tab.nav") { e.preventDefault(); cycle(e.shiftKey ? -1 : 1); }
      if (b.bind === "spine.shortcut") { e.preventDefault(); spine.focus(); }
    });
  });

  fetch("/api/keybinds").then(function (r) { return r.json(); }).then(function (j) {
    binds = j.binds || [];
  });
  fetch("/api/roots").then(function (r) { return r.json(); }).then(function (j) {
    roots = j.roots || [];
    paintTabs();
    var pick = -1;
    roots.forEach(function (path, i) {
      var name = String(path).replace(/[\\/]+$/, "").split(/[\\/]/).pop();
      if (name && name.toLowerCase() === "artifact-scanner") pick = i;
    });
    if (pick >= 0 && !selected) select(pick);
  });
  fetch("/api/columns").then(function (r) { return r.json(); }).then(function (j) {
    columns = j.columns || [];
    showSplit();
  });
  var foldPref = null;
  try { foldPref = localStorage.getItem("stratabasor.spine"); } catch (e) {}
  if (foldPref === "shut" || (foldPref === null && window.innerWidth < 700)) setFold(true);
})();
</script>
</body>
</html>
